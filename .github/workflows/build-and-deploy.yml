name: Build & Verify Attendance PWA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript type check
        run: npm run lint

      - name: Build production PWA bundle
        run: npm run build

      - name: Upload production dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: attendance-pwa-dist
          path: dist/
          retention-days: 14
